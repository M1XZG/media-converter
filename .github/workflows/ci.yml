name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Compile and import smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m py_compile app.py cleanup.py

      - name: Import and route smoke test
        run: |
          python - <<'PY'
          import app
          app.app.config.update(TESTING=True)
          c = app.app.test_client()

          r = c.get("/health")
          assert r.status_code == 200, r.status_code
          assert r.get_json().get("status") == "ok"

          r = c.get("/")
          assert r.status_code == 200
          body = r.get_data(as_text=True)
          assert "escapeHtml" in body, "escapeHtml helper missing"

          assert c.get("/files").status_code == 200
          # Path traversal must be rejected
          assert c.get("/files/download?root=converted&path=../../app.py").status_code == 404
          # Unknown root must be rejected
          assert c.get("/files/download?root=etc&path=passwd").status_code == 400
          # Download service allowlist
          assert app._detect_download_service("https://youtube.com/x") == "youtube"
          assert app._detect_download_service("https://evil.example/x") is None
          print("smoke test passed")
          PY
