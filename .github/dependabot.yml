version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "pip"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # Docker base image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
    ignore:
      # The nvidia/cuda base image tag must stay compatible with the NVIDIA
      # driver installed on the host. The NVIDIA Container Toolkit refuses to
      # start an image that requires a newer CUDA version than the host driver
      # supports (e.g. cuda>=13.3), which breaks GPU acceleration. Bump this
      # base image manually and deliberately, not via automated PRs.
      - dependency-name: "nvidia/cuda"
